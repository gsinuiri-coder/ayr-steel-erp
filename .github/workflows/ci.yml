name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 9.13.2

jobs:
  calidad:
    name: Lint, typecheck y unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ayr/shared build
      - run: pnpm --filter @ayr/api db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @ayr/api test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-api
          path: apps/api/coverage/lcov.info
          if-no-files-found: ignore

  e2e:
    name: E2E Playwright (Postgres del runner)
    runs-on: ubuntu-latest
    needs: calidad
    # D-202: la suite completa corre contra un Postgres de servicio **dentro del runner**, no
    # contra Neon. D-201 midió que la lentitud del E2E en CI era consultas × latencia
    # runner→Neon, y esa latencia cambia con la región donde cae el runner (16 ms en `eastus`,
    # 33 en `centralus`, ~80 en la corrida que se cortó a los 110 min). Con la base a 0 ms, la
    # duración vuelve a depender del código y no de la lotería de la región.
    #
    # Lo que solo Neon valida (pooler, planes de consulta reales, migraciones aplicadas ahí)
    # sigue cubierto por el job `smoke-neon`, más abajo.
    #
    # Medido en la primera corrida (run 34898572060, runner WestUS3): 308 tests en 9,8 min, job
    # completo en 12 min, 124 504 consultas a 0,07 ms cada una. 30 deja ×2,5 sobre ese número:
    # alcanza para el crecimiento de la suite, y un corte ya significa «algo se colgó», no «cayó
    # lejos de Neon».
    timeout-minutes: 30
    services:
      postgres:
        # La misma imagen que docker-compose.yml: local y CI corren la suite sobre el mismo motor.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ayr
          POSTGRES_PASSWORD: ayr_ci
          POSTGRES_DB: ayr_ci_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayr -d ayr_ci_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # El job corre en el runner, no en un contenedor: el servicio se alcanza por el puerto
      # mapeado en `localhost`, que es exactamente el host que admite el guard de
      # `apps/api/prisma/test-db-guard.ts` para `ayr_ci_e2e` (y solo con GITHUB_ACTIONS=true).
      # La contraseña no es un secreto: la base nace y muere con el job.
      DATABASE_URL: postgresql://ayr:ayr_ci@localhost:5432/ayr_ci_e2e?schema=public
      DIRECT_URL: postgresql://ayr:ayr_ci@localhost:5432/ayr_ci_e2e?schema=public
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CI: true
      ALLOW_DB_RESET: '1'
      THROTTLE_DISABLED: 'true'
      APIS_NET_PE_TOKEN: ${{ secrets.APIS_NET_PE_TOKEN }}
      # D-071: PSE de facturación electrónica. En CI apunta **siempre** a la cuenta demo;
      # un comprobante aceptado por SUNAT no se borra, se da de baja.
      NUBEFACT_URL: ${{ secrets.NUBEFACT_URL }}
      NUBEFACT_TOKEN: ${{ secrets.NUBEFACT_TOKEN }}
      # D-216 (M0d): explícita para que la suite no cambie de comportamiento — solo
      # `production` queda sin definirla.
      PSE_ENABLED: 'true'
      # RUC receptor de los comprobantes de prueba. Vacío = los E2E saltan la aceptación
      # en vez de emitir contra un RUC que SUNAT no reconoce.
      E2E_CUSTOMER_RUC: ${{ secrets.E2E_CUSTOMER_RUC }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ayr/shared build
      - run: pnpm --filter @ayr/api db:generate
      - run: pnpm --filter @ayr/api build
      - run: pnpm --filter @ayr/web build
        env:
          API_URL: http://localhost:3000
      - name: Caché de navegadores Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  smoke-neon:
    name: Smoke E2E y migraciones (Neon ci)
    runs-on: ubuntu-latest
    needs: calidad
    # D-202: lo que el Postgres del runner no puede validar. Migraciones aplicadas sobre Neon,
    # el reset con su guard contra el endpoint real de la rama `ci` (D-181) y una docena de
    # specs representativos (`scripts/e2e-smoke.mjs`) pasando por el pooler de Neon. Si la
    # región del runner lo pone lento, son ~40 tests y no 308. Medido en la primera corrida
    # (run 34898572060): 35 tests en 8,2 min, job completo en 10 min. 45 cubre un runner
    # varias veces más lejos de Neon que ese.
    timeout-minutes: 45
    # La rama Neon `ci` se resetea en cada corrida: solo una corrida a la vez.
    concurrency:
      group: neon-ci-branch
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CI: true
      ALLOW_DB_RESET: '1'
      THROTTLE_DISABLED: 'true'
      # Sin NUBEFACT_*: el smoke recorre la emisión por el camino sin PSE atado (contingencia,
      # D-073/D-080). La aceptación real es `pnpm e2e:pse`, fuera de CI.
      # D-216 (M0d): `PSE_ENABLED=true` igual, para que ese camino sin credenciales siga
      # siendo la contingencia de D-073 (toma correlativo, queda pendiente) y no el rechazo
      # explícito nuevo — son dos caminos distintos y este job prueba el primero.
      PSE_ENABLED: 'true'
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ayr/shared build
      - run: pnpm --filter @ayr/api db:generate
      # Migraciones sobre Neon **antes** de la suite, en su propio paso: si una migración no
      # aplica ahí, el rojo tiene que decir «migración» y no «falló el global-setup».
      - name: Migraciones sobre Neon ci
        run: |
          pnpm --filter @ayr/api db:deploy
          pnpm --filter @ayr/api exec prisma migrate status
      - run: pnpm --filter @ayr/api build
      - run: pnpm --filter @ayr/web build
        env:
          API_URL: http://localhost:3000
      - name: Caché de navegadores Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: pnpm e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke-neon
          path: playwright-report
          retention-days: 7

  analisis:
    name: Análisis estático (SonarCloud o Semgrep)
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-api
          path: apps/api/coverage
        continue-on-error: true
      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Semgrep OSS (fallback D-011)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          pipx install semgrep
          semgrep scan --config p/ci --config p/typescript --config p/secrets --error --exclude node_modules --exclude .next --exclude dist
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
