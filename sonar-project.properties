# Se completa desde CI: sonar.organization y sonar.projectKey vienen de secrets/vars.
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/src,e2e/tests
sonar.test.inclusions=**/*.spec.ts,e2e/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/components/ui/**,**/*.spec.ts
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
# D-266: los componentes y páginas del web (TSX) se verifican con Playwright (D-011) y no tienen
# runner unitario: vitest cubre solo las funciones puras de `apps/web/src/**/*.ts`. Contarlos
# como cobertura 0 % hundía el gate de código nuevo de todo PR que tocara UI (#9 a #15). Se
# excluyen **solo de la métrica de cobertura**: bugs, vulnerabilidades y code smells siguen
# analizándose. La lógica que merezca cobertura va a un `.ts` puro, que sí cuenta.
sonar.coverage.exclusions=apps/web/src/**/*.tsx
sonar.sourceEncoding=UTF-8
