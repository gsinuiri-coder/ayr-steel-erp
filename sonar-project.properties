# Se completa desde CI: sonar.organization y sonar.projectKey vienen de secrets/vars.
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/src,e2e/tests
sonar.test.inclusions=**/*.spec.ts,e2e/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/components/ui/**,**/*.spec.ts
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.sourceEncoding=UTF-8
